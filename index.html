<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi Hebdo Progression – Donga</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f3b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi Donga">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#1f2933;--mut:#6b7280;--br:#dde1e7;--p:#274c77;--ok:#3d6b55;--ko:#9b4a4a;--warn:#8f6a2e;--v:#4f5683;--sec:#e8ebf0}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#1f3b5c;color:#fff;padding:14px 16px;border-bottom:3px solid #8da2b8}
header h1{margin:0;font-size:18px}header small{opacity:.8}
#bandeau{background:#fff3cc;color:#5a4300;border-bottom:2px solid #e3b84f;overflow:hidden;font-size:15px;font-weight:600}
.bd-in{overflow:hidden;white-space:nowrap}
.bd-track{display:inline-block;padding:9px 0;animation:bdmove 40s linear infinite;will-change:transform}
.bd-track:hover,.bd-track:active{animation-play-state:paused}
.bd-i{padding:0 18px}.bd-s{color:#c9962b}
@keyframes bdmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.bd-track{animation:none;white-space:normal;display:block;padding:9px 14px}}
body.mode-rapport #bandeau{display:none!important}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.card{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:18px;margin:4px 0 10px}h3{font-size:16px;margin:0 0 6px}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--br);border-radius:8px;font:inherit;background:#fff}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;color:#fff;background:var(--p);cursor:pointer;margin:6px 6px 0 0}
button.sec{background:var(--sec);color:var(--tx)}button.ok{background:var(--ok)}button.ko{background:var(--ko)}button.v{background:var(--v)}button.sm{padding:8px 12px;font-size:14px}
button:disabled{opacity:.5}
.big{display:block;width:100%;text-align:left;margin:10px 0;padding:16px;font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{margin:0;background:var(--sec);color:var(--tx);white-space:nowrap}.tabs button.on{background:var(--p);color:#fff}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:15px}.msg.err{background:#f6e9e9;color:var(--ko)}.msg.good{background:#e6f0ea;color:var(--ok)}.msg.info{background:#e8edf4;color:#274c77}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.t-retard{background:var(--ko)}.t-conforme{background:var(--ok)}.t-avance{background:var(--p)}.t-non_commence{background:#6b7280}.big.b1{background:#2f5d8a}.big.b2{background:#4f5683}.big.b3{background:#3d6b55}.big.b4{background:#6b5b2e}
.t-en_attente{background:var(--warn)}.t-valide{background:var(--ok)}.t-rejete{background:var(--ko)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 120px}
.mut{color:var(--mut);font-size:14px}.right{text-align:right}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--br);padding:6px;text-align:left;vertical-align:top}table.st{width:auto;font-size:13px}table.st th,table.st td{padding:4px 8px;text-align:center}table.st td:first-child,table.st th:first-child{text-align:left}
th{background:#eceff3}
.scroll{overflow-x:auto}
.pill{font-size:13px;color:var(--mut)}
a{color:var(--p)}

table.tm{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
table.tm th,table.tm td{border:1px solid #444;padding:4px 5px;text-align:center;vertical-align:middle}
table.tm th{background:#e8edf3;font-weight:700}
table.tm td.disc{text-align:left;font-weight:700;font-style:italic}
table.tm td.obs{font-size:10.5px;text-align:left}
#rapport{display:none}
.rap{font-family:Arial,Helvetica,sans-serif;color:#111;font-size:11.5px;line-height:1.4}
.rap table.tm{font-size:10px;min-width:0}
.rap .sign{display:flex;justify-content:space-between;margin-top:28px}
.rap .sign div{width:45%;border-top:1px solid #333;padding-top:4px;text-align:center}
table.te{border-collapse:collapse;font-size:11px;width:100%}table.te th,table.te td{border:1px solid #999;padding:2px 4px;text-align:center;white-space:nowrap}table.te th{background:#fdf0c8}
@media print{
  body.mode-rapport main,body.mode-rapport footer,body.mode-rapport header{display:none!important}
  body.mode-rapport #rapport{display:block}
  body.mode-rapport{background:#fff}
  body.mode-rapport table.st{font-size:10px}body.mode-rapport table.te{font-size:8px}body.mode-rapport table.te td,body.mode-rapport table.te th{white-space:normal}
}

.ck details{border:1px solid var(--br);border-radius:8px;margin:8px 0;background:#fff}
.ck summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:15px}
.ck details[open]>summary{background:#eef1f5}
.ck ul{list-style:none;margin:0;padding:6px 12px 10px}
.ck li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid #eef0f3}
.ck li:first-child{border-top:0}
.ck input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;margin-top:2px;padding:0}
.ck li label{margin:0;font-weight:400;font-size:15px}
.ck .nums{display:flex;gap:8px;text-align:center;margin:8px 0}.ck .nums>div{flex:1;background:#eef1f5;border-radius:8px;padding:8px}
.ck .nums b{display:block;font-size:20px}
.ck .sa{font-weight:600;color:var(--p);padding:6px 12px 0}
.ck .actif{color:var(--ok)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
</style>
</head>
<body>
<header style="display:flex;gap:12px;align-items:center"><img src="icon-192.png" alt="" width="46" height="46" style="border-radius:10px"><div><h1>Suivi Hebdo Progression – Donga</h1></div></header>
<div id="bandeau" hidden aria-label="Annonces"><div class="bd-in"><div class="bd-track" id="bdt"></div></div></div>
