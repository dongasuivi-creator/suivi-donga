const FORM_CLASSES = ['6ème','5ème','4ème','3ème','2nde A2','2nde B','2nde C','2nde D','2nde STT','2nde STI','1ère A2','1ère B','1ère C','1ère D','1ère STT','1ère STI','Tle A2','Tle B','Tle C','Tle D','Tle STT','Tle STI'];
function formDefaut(code){
  const m = {'6E':'6ème','5E':'5ème','4E':'4ème','3E':'3ème'};
  if(m[code]) return m[code];
  const pre = code.indexOf('2NDE')===0 ? '2nde ' : code.indexOf('1ERE')===0 ? '1ère ' : code.indexOf('TLE')===0 ? 'Tle ' : '';
  if(!pre) return FORM_CLASSES[0];
  const suf = code.split('_')[1] || '';
  let serie = 'A2';
  if(/^CD|^C$|^S$/.test(suf)) serie = 'C';
  else if(/^AB/.test(suf)) serie = 'A2';
  else if(/^EFG/.test(suf)) serie = 'D';
  return pre + serie;
}
/* ====== Moteur de calcul (identique à l'application de départ) ====== */
function round1(n){return Math.round(n*10)/10}
function refPour(mat,classe){
  const D=REF_MAT[mat].data,contenu=D.progressions[classe]||{};
  return D.calendar.semaines.map(s=>{
    const ex=contenu[s.id]||null,sa=ex?ex.sa:null,act=ex?ex.activite:null;
    let items=(ex&&Array.isArray(ex.items))?ex.items.slice():decouperItems(act);
    if(!items.length&&sa)items=[sa];
    return Object.assign({},s,{sa,activite:act,items});
  });
}
function decouperItems(a){if(!a)return[];const t=String(a).trim();if(!t)return[];const m=t.split(".").map(x=>x.trim()).filter(x=>x);return m.length?m:[t]}
function cumulPrevuADate(ref,d){let r=0;ref.forEach(s=>{if(s.type==="cours"&&typeof s.cumulPrevu==="number"&&s.debut<=d)r=s.cumulPrevu});return r}
function evaluerStatut(prevu,real){
  const e=round1(real-prevu);
  if(real===0&&prevu===0)return{statut:"non_commence",ecart:0};
  if(e>0.5)return{statut:"avance",ecart:e};
  if(e<-0.5)return{statut:"retard",ecart:e};
  return{statut:"conforme",ecart:e};
}
function fmtNb(n){const r=round1(Math.abs(n));return Number.isInteger(r)?String(r):String(r).replace(".",",")}
function messageEcart(st,ec,vol){
  const h=(typeof vol==="number"&&vol>0)?round1(ec/100*vol):null;
  const d=h!==null?fmtNb(h)+" heure"+(Math.abs(h)>1?"s":""):fmtNb(ec)+" point"+(Math.abs(ec)>1?"s":"")+" de %";
  if(st==="retard")return"Retard de "+d+" sur le calendrier prévu.";
  if(st==="avance")return"En avance de "+d+" sur le calendrier prévu.";
  if(st==="non_commence")return"Aucune progression saisie pour le moment.";
  return"Progression conforme au calendrier prévu.";
}
function semaineRef(ref,date){
  const cours=ref.filter(s=>s.type==="cours");
  const act=ref.find(s=>date>=s.debut&&date<=s.fin);
  if(act&&act.type==="cours")return act;
  let d=null;for(const s of cours){if(s.fin<=date)d=s;else break}
  return d||cours[0];
}
const ddmm=iso=>{const p=iso.split("-");return p[2]+"/"+p[1]};

/* Composant « cases à cocher » : utilisé par l'enseignant et par l'AE.
   o = {mat, classe, coches, date, dateFixe, motif, el, bouton, persist(C), onSave(res)} */
function composantCoches(o){
  const D=REF_MAT[o.mat].data,ref=refPour(o.mat,o.classe),cours=ref.filter(s=>s.type==="cours");
  const C=JSON.parse(JSON.stringify(o.coches||{}));
  const vol=D.volumes[o.classe];
  let date=o.date||aujourdhui();
  const nb=id=>Array.isArray(C[id])?C[id].filter(Boolean).length:0;
  const el=o.el;
  el.innerHTML=`<div class="ck"><div class="card"><div class="row"><div><label>Date de référence</label><input type="date" id="ckd" value="${esc(date)}" ${o.dateFixe?"disabled":""}></div><div><label>Semaine</label><div id="cksem" style="padding:11px 0;font-weight:700"></div></div></div>
  <div class="nums"><div>Prévu<b id="ckp"></b></div><div>Réalisé<b id="ckr"></b></div><div>Écart<b id="cke"></b></div></div>
  <div id="cka" class="msg info"></div>
  <label>Motif (obligatoire en cas de retard)</label><textarea id="ckmo" rows="2">${esc(o.motif||"")}</textarea></div>
  <p class="mut" style="margin:8px 4px">Cochez les notions déjà traitées. Les semaines à venir cochées comptent comme avance.</p>
  <div id="ckw">${cours.map(s=>`<details data-w="${s.id}"><summary id="sm-${s.id}"></summary>
    ${s.sa?`<div class="sa">${esc(s.sa)}</div>`:""}
    ${s.items.length?`<ul>${s.items.map((it,i)=>`<li><input type="checkbox" id="ck-${s.id}-${i}" data-w="${s.id}" data-i="${i}" ${Array.isArray(C[s.id])&&C[s.id][i]?"checked":""}><label for="ck-${s.id}-${i}">${esc(it)}</label></li>`).join("")}</ul>`:'<p class="mut" style="padding:6px 12px">Aucun contenu renseigné pour cette semaine.</p>'}</details>`).join("")}</div>
  <div class="card"><button class="ok" id="cks">${esc(o.bouton||"Enregistrer")}</button><div id="ckm"></div></div></div>`;
  let cur=null;
  function calc(){
    const sais={};cours.forEach(s=>{const n=nb(s.id);sais[s.id]=(n>0&&s.items.length&&typeof s.prevu==="number")?round1(n/s.items.length*s.prevu):null});
    let real=0;cours.forEach(s=>{if(typeof sais[s.id]==="number")real+=sais[s.id]});real=round1(real);
    const prev=cumulPrevuADate(ref,date),ev=evaluerStatut(prev,real),wk=semaineRef(ref,date);
    cur={prev,real,ev,wk,sem:parseInt(wk.id.replace(/^S0?/,""),10)};
    $("#ckp").textContent=fmtNb(prev)+"%";$("#ckr").textContent=fmtNb(real)+"%";
    $("#cke").textContent=(ev.ecart>0?"+":ev.ecart<0?"−":"")+fmtNb(ev.ecart);
    $("#cksem").textContent="S"+cur.sem+" ("+ddmm(wk.debut)+" – "+ddmm(wk.fin)+")";
    const a=$("#cka");a.className="msg "+(ev.statut==="retard"?"err":ev.statut==="avance"?"info":"good");a.textContent=messageEcart(ev.statut,ev.ecart,vol);
    cours.forEach(s=>{
      const n=nb(s.id),r=sais[s.id];
      $("#sm-"+s.id).innerHTML="S"+s.id.replace(/^S0?/,"")+" · "+ddmm(s.debut)+" – "+ddmm(s.fin)+" · "+n+"/"+s.items.length+(r!=null?" · "+fmtNb(r)+"%":"")+(s.id===wk.id?' <span class="actif">← en cours</span>':"");
    });
  }
  calc();
  const w0=el.querySelector('details[data-w="'+cur.wk.id+'"]');if(w0)w0.open=true;
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.onchange=()=>{
    const w=cb.dataset.w,i=+cb.dataset.i,tot=cours.find(s=>s.id===w).items.length;
    if(!Array.isArray(C[w]))C[w]=new Array(tot).fill(false);
    C[w][i]=cb.checked;calc();if(o.persist)o.persist(C);
  });
  $("#ckd").onchange=e=>{if(e.target.value){date=e.target.value;calc()}};
  $("#cks").onclick=()=>{
    const mo=$("#ckmo").value.trim();
    if((cur.ev.statut==="retard"||cur.ev.statut==="non_commence")&&!mo)return note($("#ckm"),"Indiquez le motif du retard");
    o.onSave({semaine:cur.sem,date,prevu:cur.prev,realise:cur.real,ecart:cur.ev.ecart,etat:cur.ev.statut,motif:mo,coches:C});
  };
}

/* ====== Connexion par e-mail (AE et Direction) ====== */
function connexionRole(role){
  if(sess&&sess.access_token){return role==="ae"?aeDemarrer():dirDemarrer()}
  app.innerHTML=`<div class="card">${entete(role==="ae"?"Connexion AE":"Connexion Direction",true)}
  <label>Votre adresse e-mail</label><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="exemple@gmail.com">
  <button id="go">Recevoir mon code</button><div id="m"></div>
  <div id="bloc2" style="display:none"><label>Code à 6 chiffres reçu par e-mail</label>
  <input id="cd" inputmode="numeric" maxlength="8" placeholder="123456"><button class="ok" id="ok">Me connecter</button></div></div>`;
  lierRetour();
  $("#go").onclick=async()=>{
    const em=$("#em").value.trim().toLowerCase();
    if(!/^\S+@\S+\.\S+$/.test(em))return note($("#m"),"Adresse e-mail invalide");
    $("#go").disabled=true;
    try{
      await envoyerCode(em);
      note($("#m"),"Code envoyé. Il peut mettre quelques minutes à arriver : regardez votre boîte e-mail et les courriers indésirables (spam). Ne redemandez pas tout de suite.","good");
      $("#bloc2").style.display="block";
      let t=60;const bt=$("#go");bt.disabled=true;
      const iv=setInterval(()=>{t--;if(t<=0){clearInterval(iv);bt.disabled=false;bt.textContent="Recevoir un nouveau code"}else bt.textContent="Nouveau code possible dans "+t+" s"},1000);
      return;
    }catch(e){note($("#m"),/rate|limit|seconds/i.test(e.message)?"Trop de demandes. Attendez une minute puis réessayez, ou utilisez le dernier code reçu.":e.message)}
    $("#go").disabled=false;
  };
  $("#ok").onclick=async()=>{
    const em=$("#em").value.trim().toLowerCase(),cd=$("#cd").value.replace(/\D/g,"");
    if(cd.length<6)return note($("#m"),"Entrez le code à 6 chiffres");
    try{await verifierCode(em,cd);role==="ae"?aeDemarrer():dirDemarrer()}
    catch(e){note($("#m"),"Code incorrect ou expiré")}
  };
}

let AE={aff:[],cens:[],cur:null,tab:"valider",sem:semDefaut()};
async function aeDemarrer(){
  app.innerHTML='<div class="card">Chargement…</div>';
  try{
    const em=encodeURIComponent(sess.email);
    const [a,c]=await Promise.all([
      rest("affectations?select=id,nom,matiere,etablissement_id,etablissements(nom)&email=eq."+em+"&order=matiere"),
      rest("censeurs?select=email,whatsapp,etablissement_id,etablissements(nom)&email=eq."+em)]);
    if(!a.length&&!c.length){app.innerHTML=`<div class="card"><div class="msg err">Cette adresse (${esc(sess.email)}) n'est pas encore enregistrée. Demandez à votre censeur de vous ajouter comme AE.</div><button id="d">Se déconnecter</button></div>`;$("#d").onclick=deconnexion;return}

  try{
    const ens=await rest(`enseignants?select=id,nom,matricule&etablissement_id=eq.${c.etablissement_id}&matiere=eq.${c.matiere}&actif=eq.true&order=nom`);
    if(!ens.length){z.innerHTML='<div class="msg info">Ajoutez d\'abord vos collègues dans l\'onglet « Enseignants ».</div>';return}
    z.innerHTML=`<div class="card"><h3>Saisir le point d'un collègue</h3>
    <label>Enseignant</label><select id="en">${ens.map(e=>`<option value="${e.id}" ${AE.pre===e.id?"selected":""}>${esc(e.nom)}</option>`).join("")}</select>
    <label>Classe (niveau)</label><select id="cl">${listeClasses(c.matiere).map(x=>`<option value="${x.code}">${esc(x.nom)}</option>`).join("")}</select>
    <div class="row"><div><label>Numéro / nom de la classe</label><input id="dv" placeholder="ex : M1, 2, B"></div>
    <div><label>Classe dans le formulaire de la Direction</label><select id="fc">${FORM_CLASSES.map(x=>`<option>${x}</option>`).join("")}</select></div></div>
    <button id="ouv">Ouvrir les notions</button><div id="m"></div></div><div id="ck"></div>`;
    const majFc=()=>{$("#fc").value=formDefaut($("#cl").value)};majFc();$("#cl").onchange=majFc;
    $("#ouv").onclick=async()=>{
      const eid=$("#en").value,code=$("#cl").value,dv=$("#dv").value.trim(),fc=$("#fc").value;
      let C={},motif="";
      try{
        const prev=await rest(`soumissions?select=coches,motif&enseignant_id=eq.${eid}&classe_code=eq.${encodeURIComponent(code)}&division=eq.${encodeURIComponent(dv)}&coches=not.is.null&order=semaine.desc&limit=1`);
        if(prev[0]&&prev[0].coches)C=prev[0].coches;
      }catch(e){}
      composantCoches({mat:c.matiere,classe:code,coches:C,motif,el:$("#ck"),bouton:"Enregistrer (déjà validé)",
        onSave:async r=>{
          try{
            await rest("soumissions?on_conflict=enseignant_id,classe_code,division,semaine",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},
              body:{enseignant_id:eid,etablissement_id:c.etablissement_id,matiere:c.matiere,classe_code:code,division:dv,classe_formulaire:fc,semaine:r.semaine,date_situation:r.date,
              taux_prevu:r.prevu,taux_realise:r.realise,ecart:r.ecart,etat:r.etat,motif:r.motif,coches:r.coches,statut:"valide",saisi_par:"ae",valide_le:new Date().toISOString(),valide_par:sess.email}});
            note($("#ckm"),"Enregistré et validé pour la semaine "+r.semaine,"good");
          }catch(e){note($("#ckm"),e.message)}
        }});
      $("#ck").scrollIntoView();
    };
  }catch(e){z.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}

async function aeEns(){
  const z=$("#zone"),c=AE.cur;
  z.innerHTML='<div class="card">Chargement…</div>';
  try{
    const ens=await rest(`enseignants?select=id,nom,matricule,whatsapp,email&etablissement_id=eq.${c.etablissement_id}&matiere=eq.${c.matiere}&actif=eq.true&order=nom`);
    z.innerHTML=`<div class="card"><h3>Ajouter un collègue</h3>
    <label>Nom et prénoms</label><input id="n"><label>Matricule</label><input id="mt">
    <label>Numéro WhatsApp</label><input id="w" inputmode="tel"><label>E-mail (facultatif)</label><input id="e" type="email">
    <button id="ad">Ajouter et créer son code</button><div id="m"></div></div>
    <div class="card"><h3>Mes collègues (${ens.length})</h3>${ens.map(e=>`<div style="padding:8px 0;border-top:1px solid var(--br)"><b>${esc(e.nom)}</b> <span class="mut">${esc(e.matricule)} · ${esc(e.whatsapp)}</span><br>
    <button class="sec sm" data-code="${e.id}" data-n="${esc(e.nom)}" data-w="${esc(e.whatsapp)}">Nouveau code</button><button class="ko sm" data-del="${e.id}" data-n="${esc(e.nom)}">Retirer</button><div id="cd-${e.id}"></div></div>`).join("")||'<p class="mut">Aucun collègue pour l\'instant.</p>'}</div>`;
    $("#ad").onclick=async()=>{
      const n=$("#n").value.trim(),mt=$("#mt").value.trim(),w=tel($("#w").value),em=$("#e").value.trim();
      if(n.length<3||!mt||w.length<8)return note($("#m"),"Nom, matricule et numéro WhatsApp sont obligatoires");
      try{
        const r=await rest("enseignants?select=id",{method:"POST",headers:{Prefer:"return=representation"},body:{etablissement_id:c.etablissement_id,matiere:c.matiere,matricule:mt,nom:n,whatsapp:w,email:em||null}});
        await donnerCode(r[0].id,n,w,true);
      }catch(e){note($("#m"),e.message.includes("duplicate")?"Ce matricule ou ce numéro existe déjà":e.message)}
    };
    z.querySelectorAll("[data-code]").forEach(b=>b.onclick=()=>donnerCode(b.dataset.code,b.dataset.n,b.dataset.w,false));
    z.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Retirer "+b.dataset.n+" ? Ses points déjà envoyés seront aussi supprimés."))return;
      try{await rest("enseignants?id=eq."+b.dataset.del,{method:"DELETE",headers:{Prefer:"return=minimal"}});aeEns()}catch(e){note($("#m"),e.message)}
    });
  }catch(e){z.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
async function donnerCode(id,nom,w,nouveau){
  const code=String(Math.floor(100000+Math.random()*900000));
  try{
    await rpc("definir_code",{p_ens:id,p_code:code});
    const txt=`Bonjour ${nom}, voici votre accès à la plateforme de suivi de progression (Donga) : numéro ${w}, code personnel ${code}. Ne le partagez pas.`;
    const html=`<div class="msg good">Code de ${esc(nom)} : <b style="font-size:20px">${code}</b><br>Notez-le ou envoyez-le maintenant (il ne sera plus affiché).<br><a href="${lienWA(w,txt)}" target="_blank" rel="noopener"><button class="ok sm">Envoyer par WhatsApp</button></a></div>`;
    if(nouveau){await aeEns();const m=$("#m");if(m)m.innerHTML=html}
    else{const b=$("#cd-"+id);if(b)b.innerHTML=html}
  }catch(e){const m=$("#m");if(m)note(m,e.message)}
}


async function censAE(){
  const z=$("#zone"),ids=AE.cens.map(x=>x.etablissement_id);
  z.innerHTML='<div class="card">Chargement…</div>';
  try{
    const a=await rest("affectations?select=id,nom,email,whatsapp,matiere,etablissement_id,etablissements(nom)&etablissement_id=in.("+ids.join(",")+")&order=matiere");
    z.innerHTML=`<div class="card"><h3>Ajouter un AE</h3><p class="mut">L'AE se connectera ensuite avec cet e-mail (code reçu par e-mail).</p>
    ${AE.cens.length>1?`<label>Collège</label><select id="ce">${AE.cens.map(x=>`<option value="${x.etablissement_id}">${esc(x.etablissements.nom)}</option>`).join("")}</select>`:""}
    <label>Nom et prénoms</label><input id="n"><label>E-mail de l'AE (pour sa connexion)</label><input id="e" type="email" inputmode="email">
    <label>Numéro WhatsApp de l'AE</label><input id="w" inputmode="tel" placeholder="01 97 89 09 52">
    <label>Discipline</label><select id="d">${MATIERES.map(m=>`<option>${m}</option>`).join("")}</select>
    <button id="ad">Ajouter cet AE</button><div id="m"></div></div>
    <div class="card"><h3>Mon numéro WhatsApp</h3><div class="row"><input id="mw" inputmode="tel" value="${esc(AE.cens[0].whatsapp||"")}" placeholder="01 97 89 09 52" style="flex:2"><button class="sec" id="svw" style="margin:0">Enregistrer</button></div><div id="mw2"></div></div>
    <div class="card"><h3>AE de mon collège (${a.length})</h3>${a.map(x=>`<p style="border-top:1px solid var(--br);padding-top:6px"><b>${esc(x.matiere)}</b> · ${esc(x.nom||"")} <span class="mut">${esc(x.email)}${x.whatsapp?" · "+esc(x.whatsapp):""}</span> ${x.whatsapp?`<a href="${lienWA(x.whatsapp,"Bonjour "+(x.nom||"")+", vous êtes enregistré comme AE sur la plateforme de suivi de progression (Donga). Connectez-vous avec votre e-mail.")}" target="_blank" rel="noopener">WhatsApp</a> `:""}<button class="ko sm" data-d="${x.id}">Retirer</button></p>`).join("")||'<p class="mut">Aucun AE pour l\'instant.</p>'}</div>`;
    $("#svw").onclick=async()=>{
      const w=tel($("#mw").value);if(w.length<8)return note($("#mw2"),"Numéro invalide");
      try{await rest("censeurs?email=eq."+encodeURIComponent(sess.email),{method:"PATCH",headers:{Prefer:"return=minimal"},body:{whatsapp:w}});AE.cens.forEach(x=>x.whatsapp=w);note($("#mw2"),"Numéro enregistré","good")}catch(er){note($("#mw2"),er.message)}
    };
    $("#ad").onclick=async()=>{
      const n=$("#n").value.trim(),e=$("#e").value.trim().toLowerCase();
      if(n.length<3||!/^\S+@\S+\.\S+$/.test(e))return note($("#m"),"Nom et e-mail valides obligatoires");
      try{await rest("affectations",{method:"POST",headers:{Prefer:"return=minimal"},body:{email:e,nom:n,whatsapp:tel($("#w").value)||null,etablissement_id:$("#ce")?$("#ce").value:ids[0],matiere:$("#d").value}});censAE()}
      catch(er){note($("#m"),er.message.includes("duplicate")?"Cet AE est déjà enregistré pour cette discipline":er.message)}
    };
    z.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Retirer cet AE ?"))return;
      try{await rest("affectations?id=eq."+b.dataset.d,{method:"DELETE",headers:{Prefer:"return=minimal"}});censAE()}catch(er){note($("#m"),er.message)}
    });
  }catch(e){z.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}

/* ====== Direction ====== */
let DIR={tab:"points",sem:semDefaut()};
async function dirDemarrer(){
  app.innerHTML='<div class="card">Chargement…</div>';
  try{
    const ok=await rpc("est_direction",{});
    if(ok!==true){app.innerHTML=`<div class="card"><div class="msg err">Cette adresse (${esc(sess.email)}) n'est pas autorisée pour la Direction.</div><button id="d">Se déconnecter</button></div>`;$("#d").onclick=deconnexion;return}
    DIR.tab="points";dirEcran();
  }catch(e){
    if(e.status===401){saveSess(null);return connexionRole("dir")}
    app.innerHTML=`<div class="card"><div class="msg err">${esc(e.message)}</div><button id="d">Retour</button></div>`;$("#d").onclick=accueil;
  }
}
function dirEcran(){
  app.innerHTML=`<div class="card"><div class="row" style="align-items:center"><div style="flex:3"><h2>Direction Départementale</h2><div class="mut">${esc(sess.email)}</div></div><button class="sec sm" id="q" style="flex:0 0 auto">Quitter</button></div></div>
  <div class="tabs"><button data-t="points">Points validés</button><button data-t="com">Communiqués</button><button data-t="cens">Censeurs</button><button data-t="aes">AE inscrits</button></div><div id="zone"></div>`;
  $("#q").onclick=deconnexion;
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{DIR.tab=b.dataset.t;dirOnglet()});
  dirOnglet();
}
function dirOnglet(){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===DIR.tab));
  ({points:dirPoints,com:dirCom,cens:dirCens,aes:dirAes})[DIR.tab]();
}
async function dirPoints(){
  const z=$("#zone");
  z.innerHTML=`<div class="card"><label>Semaine n°</label><div class="row"><input id="s" inputmode="numeric" value="${esc(DIR.sem)}" style="flex:2"><button id="oks" class="sec" style="margin:0">Afficher</button></div><div id="res"></div></div>`;
  const majS=()=>{DIR.sem=$("#s").value;semSauve(DIR.sem);charger()};
  $("#oks").onclick=majS;$("#s").onkeydown=e=>{if(e.key==="Enter")majS()};
  async function charger(){
    const s=parseInt(DIR.sem,10),res=$("#res");
    if(!(s>=1&&s<=45)){res.innerHTML='<div class="msg err">Semaine entre 1 et 45</div>';return}
    res.innerHTML="<p>Chargement…</p>";
    try{
      const rows=await rest(`points_valides?select=*&semaine=eq.${s}&order=matiere,etablissement,classe_formulaire`);
      let etabs=[];try{etabs=(await rest("etablissements?select=nom&order=nom")).map(x=>x.nom)}catch(e){}
      if(!rows.length){res.innerHTML='<p class="mut">Aucun point validé pour cette semaine.</p>';return}
      const dEnc=aujourdhui();
      res.innerHTML=`<p><b>${rows.length}</b> point(s) validé(s) · ${new Set(rows.map(r=>r.etablissement)).size} collège(s)</p>
      <div class="row"><div><label>Date du point</label><input id="dt" type="date" value="${dEnc}"></div><div><label>Établi par (facultatif)</label><input id="eb" placeholder="Nom du responsable"></div></div>
      <button class="ok" id="bx">Télécharger en Excel</button><button class="ko" id="bp">Télécharger en PDF</button><button class="sec" id="ex">Détail (CSV)</button>
      <h3 style="margin-top:14px">Tableau du ministère</h3><div class="scroll" id="tm"></div><p class="mut">Faites glisser le tableau pour voir toutes les colonnes.</p>
      <div id="mq"></div>
      <h3 style="margin-top:14px">Détail</h3><div class="scroll"><table><tr><th>Collège</th><th>Disc.</th><th>Enseignant</th><th>Classe</th><th>Prévu</th><th>Réalisé</th><th>État</th><th>Motif</th></tr>
      ${rows.map(r=>`<tr><td>${esc(r.etablissement)}</td><td>${esc(r.matiere)}</td><td>${esc(r.enseignant)}</td><td>${esc(r.classe_formulaire)} ${esc(r.division)}</td><td>${r.taux_prevu}</td><td>${r.taux_realise}</td><td>${esc(ETAT[r.etat]||"")}</td><td>${esc(r.motif)}</td></tr>`).join("")}</table></div>`;
      const calc=()=>{
        const iso=$("#dt").value||dEnc;
        const dateFr=new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
        const S=synthese(rows,s,dateFr,$("#eb").value.trim(),etabs);
        $("#tm").innerHTML=tableauMinistere(S);
        $("#mq").innerHTML=S.manquants.length?`<p class="mut"><b>Collèges sans point validé :</b> ${S.manquants.map(esc).join(", ")}</p>`:"";
        return S;
      };
      calc();
      $("#dt").onchange=calc;$("#eb").oninput=calc;
      $("#bx").onclick=()=>dirExcel(calc());
      $("#bp").onclick=()=>dirPDF(calc());
      $("#ex").onclick=()=>telecharger("points-valides-S"+s+".csv",csv([["Collège","Discipline","Matricule","Enseignant","Classe","Division","Semaine","Prévu %","Réalisé %","Écart","État","Motif"]].concat(rows.map(r=>[r.etablissement,r.matiere,r.matricule,r.enseignant,r.classe_formulaire,r.division,r.semaine,r.taux_prevu,r.taux_realise,r.ecart,ETAT[r.etat]||"",r.motif]))));
    }catch(e){res.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
  }
  charger();
}
async function dirCens(){
  const z=$("#zone");z.innerHTML='<div class="card">Chargement…</div>';
  try{
    const c=await rest("censeurs?select=email,nom,whatsapp,etablissements(nom)&order=email");
    z.innerHTML=`<div class="card"><h3>Ajouter des censeurs</h3>
    <p class="mut">Une ligne par censeur : <b>e-mail ; nom ; collège ; numéro WhatsApp</b></p>
    <textarea id="t" rows="5" placeholder="censeur1@gmail.com ; KOFFI Jean ; CEG Barei ; 01 97 89 09 52&#10;censeur2@gmail.com ; ADJO Marie ; CEG Djougou 1 ; 01 90 00 00 00"></textarea>
    <button id="ad">Enregistrer</button><div id="m"></div></div>
    <div class="card"><h3>Censeurs enregistrés (${c.length})</h3>${c.map(x=>`<p style="border-top:1px solid var(--br);padding-top:6px"><b>${esc(x.etablissements.nom)}</b> · ${esc(x.nom||"")} <span class="mut">${esc(x.email)} · ${x.whatsapp?esc(x.whatsapp):"numéro manquant"}</span> <button class="ko sm" data-d="${esc(x.email)}">Retirer</button></p>`).join("")||'<p class="mut">Aucun censeur.</p>'}</div>`;
    $("#ad").onclick=async()=>{
      const l=$("#t").value.split(/\r?\n/).map(x=>x.split(/[;\t]/).map(y=>y.trim())).filter(x=>x[0]).map(x=>({email:x[0],nom:x[1]||"",etablissement:x[2]||"",whatsapp:x[3]||""}));
      if(!l.length)return note($("#m"),"Rien à enregistrer");
      try{const r=await rpc("ajouter_censeurs",{p_lignes:l});if(r.ok)dirCens();else note($("#m"),r.message)}catch(e){note($("#m"),e.message)}
    };
    z.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Retirer ce censeur ?"))return;
      try{await rest("censeurs?email=eq."+encodeURIComponent(b.dataset.d),{method:"DELETE",headers:{Prefer:"return=minimal"}});dirCens()}catch(e){note($("#m"),e.message)}
    });
  }catch(e){z.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
async function dirAes(){
  const z=$("#zone");z.innerHTML='<div class="card">Chargement…</div>';
  try{
    const a=await rest("affectations?select=id,nom,email,matiere,etablissements(nom)&order=matiere");
    z.innerHTML=`<div id="m"></div><div class="card"><h3>AE inscrits (${a.length})</h3>${a.map(x=>`<p style="border-top:1px solid var(--br);padding-top:6px"><b>${esc(x.nom||"")}</b> <span class="mut">${esc(x.email)}</span><br>${esc(x.matiere)} – ${esc(x.etablissements.nom)} <button class="ko sm" data-d="${x.id}">Retirer</button></p>`).join("")||'<p class="mut">Aucun AE.</p>'}</div>`;
    z.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Retirer cet AE ?"))return;
      try{await rest("affectations?id=eq."+b.dataset.d,{method:"DELETE",headers:{Prefer:"return=minimal"}});dirAes()}catch(e){note($("#m"),e.message)}
    });
  }catch(e){z.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}

accueil();
</script>
